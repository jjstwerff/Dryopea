[package]
name    = "dryopea"
version = "0.0.1"
loft    = ">=0.8.5"
description = "Sci-fi free-build / tower-defence with scramble-and-salvage runs"
license = "LGPL-3.0-or-later"

[library]
entry = "src/dryopea.loft"

[dependencies]
# `graphics` and `gridmesh` have migrated out of loft's monorepo to
# their own repo (`loft-libs-graphics`) and are published to the loft
# package registry — so they resolve by version, not by path.
#
# `graphics` provides the headless Canvas software rasterizer +
# save_png (works without a GL context — see the library's own
# tests/canvas.loft for the pattern).  GL window functions also live
# in this lib for the live renderer.
graphics = ">=0.5.0"

# Plan 07 — shared world substrate.  `gridmesh` is the standalone,
# zero-dependency chunk + dirty + mesh-pipeline toolkit (axial).
# dryopea adopts its ChunkField/dirty engine so edits rebuild only
# changed chunks instead of the whole world per frame.
gridmesh = ">=0.1.2"

# Plan 09 I1 — the one key→action table.  dryopea's editor had 28
# `gl_key_pressed` calls in `main.loft` and a script runner that
# bypassed the key layer entirely, so a wrong binding was invisible
# to every gate.  `input` supplies the polling + binding lookup;
# `input_tick_from_state` is what lets a script drive the SAME input
# object the GL loop drives, which is what keeps them one machine.
input = ">=0.2.0"

# Plan 09 C1 — THE lattice.  `hex_grid` calls itself "the canonical
# HEX-GRID geometry … THE CONVENTION (shared with moros — the single
# executable source of it)": pointy-top, odd-r offset.  dryopea was
# the ecosystem's only axial flat-top consumer, so dryopea converts.
# `src/lattice.loft` is a thin adapter over this — dryopea's `Hex`
# type and dryopea's metres, never a second implementation.
hex_grid = ">=0.1.0"

# Plan 21 R1 — the game's camera.  `mesh3d` owns the linear algebra:
# `Vec3`, `Mat4`, `mat4_look_at`, `mat4_perspective`.  It used to live
# in `graphics/src/math.loft` and moved out at graphics 0.4.3, so
# `graphics` already pulls it — declared here anyway because
# `src/render_camera.loft` calls it DIRECTLY, and a graphics release
# that stopped depending on it would otherwise break dryopea from a
# distance.  Zero dependencies of its own.
mesh3d = ">=0.1.1"

# Plan 25 M3 — the GL gate.  `gl_screenshot` writes a PNG and
# `imaging::png` is the only decoder in the registry, so this is what
# closes docs/RENDERER.md § R4's chain: GL → capture → decode →
# `classify_canvas`, the SAME instrument every software band in this
# repo was sized against.
#
# ⚠ It was deliberately NOT a dependency until now.  `probe/r0` needed
# it in 2026-08-15 and carried it in the probe's own manifest instead —
# `probe/README.md`: "adding it to dryopea's manifest on the strength of
# a probe is how an experiment becomes a commitment nobody decided to
# make."  M3 is the phase that needs it, so M3 is when it joins.
imaging = ">=0.2.0"

# `moros_map` is the shared world data model — Map / Chunk / Hex with
# {q,r,cy} multi-floor, height, material, walls, items.  Plan 07 W1
# will adopt it so world-building routines interchange with moros.
#
# Not yet consumed by any src/ module.  The reason USED to be a loft
# bug: it defines `struct Hex`, which collided with dryopea's
# `world::Hex` in a flat global type registry, and loading both
# panicked ("Double structure type …").  **That is fixed** as of loft
# 2026.8.0 — two libraries may each declare a name, and the bare use
# site is a clean error naming its own fix.  Re-confirmed 2026-08-12
# by plan 09 I0 against `camera::InputState` / `input::InputState`;
# see QUESTIONS_FOR_LOFT.md § Resolved.  So W1's stated blocker is
# gone and the phase wants re-reading; what stands between here and
# there now is only that this path-dep is NOT INSTALLED (`loft api`
# says so).  Declared here, harmless while unused.
#
# Not published to the registry, so it stays a path-dep — into the
# moros checkout, which is where the shared world model now lives.
moros_map = { path = "../moros/lib/moros_map" }

# Plan 26 L6 — the fixed step, extracted.  `src/tick_clock.loft`,
# `tick_bank.loft` and `tick_timer.loft` moved here unchanged: dryopea
# had SEVEN hand-rolled *do-not-lose-a-fraction* sites and moros two
# more, and every one of them existed because there was nothing to
# consume.  ⚠ Zero dependencies of its own, deliberately — a timing
# library that pulled in a lattice or a renderer could not be consumed
# by the next game.
#
# ⚠ It lives in `loft-libs-game` beside `input`, and the reason is the
# repo's own: that chunk is *"runtime game services … consumed by every
# game"*, and a fixed timestep is needed by every game that is built.
# ⚠⚠ Its README has advertised the slot since bootstrap — the `time/`
# row reads *"frame counter, dt, scheduling"* — and `time` shipped as
# date arithmetic instead, so the slot was never filled.  This fills it.
fixstep = ">=0.1"

# Plan 20 A1 — the PART MODEL, and dryopea re-implements none of it.
# `docs/PARTS.md` § D1 (`@X001`) decided this after the first draft got it
# wrong: it chose "a dryopea-native part model" on the strength of having
# read moros's unpublished `hex_part` and never checking the published
# family.  `hex_body` calls itself *"a body is a RIG — bones and the limits
# in the joints between them, never a pose"*, which IS § D4's design, and
# it ships `Rig` / `rig_bone` / `Joint` with `joint_fits` / `joint_offer` /
# `joint_residual`, `rig_world_seg`, `bone_obb` / `obb_contains`,
# `rig_write` / `rig_read` and `rig_admissible` / `rig_eq`.
#
# ⚠ Where it stops is 3-D: there is not one `z` in the package.  That is an
# ADDITIVE enhancement proposed upstream rather than a shape dryopea
# invents — loft-libs-world#14 (`rig_bone3`), which `plans/20` A2 needs and
# A1 does not.
#
# ⚠ `hex_part` stays out of scope and that half of § D1 is unchanged: it is
# 4 000 unpublished lines whose premise is *"a part IS a world"*, i.e. a
# `hex_voxel` store with its own `.hxw` format.  Its socket records are the
# shape `src/part.loft` follows; the dependency is not.
# ⚠ `>=0.2`, not `>=0.1`: A2's canopy hinges about a LATERAL axis while the
# rotors sit at four heights (`PARTS.md` § D7), and `rig_bone3` is 0.2.0.
# ⚠⚠ 0.2.0 is NOT a drop-in for 0.1.0 and its manifest says so — `struct Rig`
# gained four fields, so a consumer who built one by LITERAL now omits them and
# an absent axis reads as (0,0,0).  dryopea is unaffected because `part.loft`
# builds through `rig_new` + `rig_bone`, never a literal — which is what the
# library's README and USAGE both show.
# ⚠ `>=0.3` for the world FRAME.  A2's emitter poses a limb's vertices,
# which needs a bone's BASIS — `rig_world_seg3` answers a base and a tip,
# both ON the bone's axis, and a limb is a cloud of points that are not.
# dryopea added `Frame` / `rig_world_frame3` / `frame_point` upstream
# rather than re-deriving forward kinematics here (`PARTS.md` § D1).
#
# ⚠ Consumed by `src/part.loft`, `src/catalogue.loft`, `src/part_mesh.loft`
# and `src/pose.loft` (plan 20 A1-A4).  The heap corruption that held A2
# out was a STALE BINARY and not a bug in the tree (`@M038`).
hex_body = ">=0.3"
